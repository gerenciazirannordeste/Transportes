<style>
:root{--red:#E11D2D;--red2:#B8141F;--amber:#F59E0B;--dark:#14161A;--dark2:#1D2026;--dark3:#2A2E36;--bg:#F3F4F6;--card:#fff;--tx:#191B1F;--mut:#6B7280;--bd:#E2E4E8;--ok:#15803D;--okbg:#DCFCE7;--wn:#B45309;--wnbg:#FEF3C7;--er:#B91C1C;--erbg:#FEE2E2;--in:#1D4ED8;--inbg:#DBEAFE;--r:10px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:232px 1fr;grid-template-rows:56px 1fr;min-height:100vh}
.hdr{grid-column:1/-1;position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:14px;padding:0 20px;background:#1b1b1d;border-bottom:1px solid #2b2b2f;height:56px}
.hlogo{height:24px;display:block}
.htxt{color:#cfd3da;font-size:14px;white-space:nowrap}
.hdr .sp{flex:1}
.huser{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.huser b{color:#fff;font-size:13px}.huser small{color:var(--amber);font-size:11px}
.hdr .hamb{color:#fff}
.ptitle{padding:18px 24px 0}.ptitle h1{margin:0;font-size:19px}
.side{background:var(--dark);color:#cfd3da;display:flex;flex-direction:column;position:sticky;top:56px;height:calc(100vh - 56px)}
.brand{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:18px 16px;border-bottom:1px solid var(--dark3)}
.blogo{height:34px;display:block}
.brand b{color:#fff;letter-spacing:.14em;font-weight:800;font-size:16px;display:block}
.brand small{color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.logo svg{width:34px;height:34px;display:block}
nav{padding:10px 8px;flex:1;overflow:auto}
nav a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;color:#cfd3da;font-weight:500;margin-bottom:2px;border-left:3px solid transparent}
nav a:hover{background:var(--dark2);color:#fff}
nav a.on{background:var(--dark2);color:#fff;border-left-color:var(--red)}
.nb{background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.me{padding:14px 16px;border-top:1px solid var(--dark3);display:flex;flex-direction:column;gap:2px}
.me b{color:#fff}.me small{color:var(--amber);margin-bottom:8px}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;flex:1}
.hamb{display:none;background:none;border:0;font-size:22px;cursor:pointer;padding:0 4px}
.demo{background:var(--wnbg);color:var(--wn);font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap}
.content{padding:20px 24px 60px;max-width:1400px}
.scrim{display:none}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:56px;z-index:30;width:250px;height:calc(100vh - 56px);transform:translateX(-100%);transition:transform .2s}.nav-open .side{transform:none}.nav-open .scrim{display:block;position:fixed;inset:56px 0 0 0;background:#0006;z-index:20}.hamb{display:block}.hdr{padding:0 12px;gap:10px}.htxt,.huser{display:none}.ptitle{padding:14px 14px 0}.content{padding:14px 14px 60px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:960px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;border-top:3px solid var(--red)}
.kpi.a{border-top-color:var(--amber)}
.kpi small{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:24px;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
.bar select,.bar input{width:auto;min-width:150px}
.btn{border:1px solid var(--bd);background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c2c6cd}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{background:var(--red2)}
.btn.d{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.ghost{background:transparent;border-color:var(--dark3);color:#cfd3da}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.lg{padding:13px 18px;font-size:15px}
.btn.danger{color:var(--er);border-color:#f0c2c2}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:9px 10px;background:#fff;width:100%;min-width:0}
input:disabled{background:#F3F4F6}
input:focus,select:focus,textarea:focus{outline:2px solid #E11D2D2e;border-color:var(--red)}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
.req::after{content:" *";color:var(--red)}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:10px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
.tw td input{min-width:90px}
table{width:100%;border-collapse:collapse}
th{background:#F8F9FA;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.ck{cursor:pointer}tr.ck:hover td{background:#FFF6F6}
td.n,th.n{text-align:right;white-space:nowrap}
.tg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.t-pre{background:var(--inbg);color:var(--in)}.t-aberta{background:var(--wnbg);color:var(--wn)}.t-execucao{background:#EDE9FE;color:#6D28D9}.t-finalizada{background:var(--okbg);color:var(--ok)}.t-cancelada{background:#F3F4F6;color:#6B7280}

function cpfValido(c){c=soDig(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;const d=k=>{let s=0;for(let i=0;i<k;i++)s+=+c[i]*(k+1-i);const r=(s*10)%11;return r===10?0:r};return d(9)===+c[9]&&d(10)===+c[10]}

const ISO_V=(()=>{const t={};let v=10;for(let i=0;i<26;i++){if(v%11===0)v++;t[String.fromCharCode(65+i)]=v;v++}return t})();
function cntrOk(c){if(!/^[A-Z]{4}\d{7}$/.test(c))return false;let s=0;for(let i=0;i<10;i++){const ch=c[i];s+=(/\d/.test(ch)?+ch:ISO_V[ch])*Math.pow(2,i)}return (s%11)%10===+c[10]}

  XLSX.writeFile(wb,nome);
}

function precoCliente(origem,destino,armador,tipo){
  const o=up(origem),d=up(destino),a=up(armador);

}
// Overtime pela data e hora do transporte: domingo/feriado o dia todo; noite (ex.: 19:00 às 06:59, de seg a sáb); sábado a partir do horário da OTT
function otTipo(t,cfg){
  const d=new Date(t.data+'T12:00:00').getDay(),h=horaDe(t)||'12:00';
  if(d===0||ehFeriado(t.data))return 'feriado';
  const ini=cfg.ini||'19:00',fim=cfg.fim||'06:59';
  if(ini>fim?(h>=ini||h<=fim):(h>=ini&&h<=fim))return 'noite';
  if(d===6&&cfg.sabIni&&h>=cfg.sabIni)return 'noite';
  return '';
}

const AUD_COL={transportes:'Transporte',ordens:'OTT / O.S.',motoristas:'Motorista',pagamentos:'Lote de pagamento',usuarios:'Usuário',config:'Configuração',logins:'Login'};
const AUD_IGN=new Set(['atualizadoEm','atualizadoPor','historicoAlt','realizadoEm','realizadoPor','criadoEm','criadoPor','id']);
const audRef=(c,o)=>!o?'':c==='transportes'?`${o.cntr||''} · OTT ${o.ott||ordNum(o.ordemId)}`:c==='ordens'?`${o.numero||''} · ${o.armador||''}`:c==='motoristas'?`${o.nome||''}${o.cpf?' · '+fCpf(o.cpf):''}`:c==='usuarios'?(o.nome||''):c==='pagamentos'?o.id:c==='logins'?'login':o.id;
const audInfo=(c,o)=>c==='transportes'?`${o.motoristaNome||''} · ${o.cavalo||''} · ${fISO(o.data)} · ${o.status||''}`:c==='ordens'?`${o.origem||''} → ${o.destino||''} · pedido ${o.qtd??'—'} · booking ${o.bookingPorto||''}`:c==='motoristas'?`placas ${[...(o.cavalos||[]),...(o.carretas||[])].join(', ')}`:c==='pagamentos'?`${fISO(o.semanaIni)} a ${fISO(o.semanaFim)} · ${o.qtd||0} cntr`:'';
function audVal(v){if(v==null||v==='')return '';if(Array.isArray(v))v=v.map(x=>typeof x==='object'?JSON.stringify(x):x).join(', ');else if(typeof v==='object')v=JSON.stringify(v);v=String(v);return v.length>160?v.slice(0,157)+'…':v}
const AUD_NOME={cntr:'Contêiner',tipo:'Tipo',lacre:'Lacre',bookingPorto:'Booking',data:'Data',hora:'Hora',motoristaId:'Motorista (id)',motoristaNome:'Motorista',motoristaCpf:'CPF motorista',cavalo:'Cavalo',carreta:'Carreta',valorFrete:'Frete',status:'Situação',pagamentoId:'Lote',obs:'Observação',motivoCancel:'Motivo exclusão',numero:'Número',armador:'Armador',origem:'Origem',destino:'Destino',qtd:'Qtd pedida',prazo:'Prazo',overtime:'Overtime',fatura:'Fatura',nome:'Nome',cpf:'CPF',cnh:'CNH',cavalos:'Cavalos',carretas:'Carretas',apelidos:'Apelidos',vinculo:'Vínculo',ativo:'Ativo',acessos:'Acessos',pend:'Pendência',linhas:'Linhas',janela:'Janela (dias)',placasFrota:'Placas da frota',locais:'Locais',armadores:'Armadores',mescladoCom:'Juntado em'};
function montaAud(ops,meta){
  if(!App.user)return [];
  const itens=[];
  ops.forEach(([op,c,o])=>{
    if(c==='historico'||c==='auditoria')return;
    const id=op==='del'?o:o.id,old=c==='transportes'?GT(id):G(c,id);
    if(op==='del'){if(old)itens.push({c,id,t:'excluiu',ref:audRef(c,old),campos:[]});return}
    const nw=op==='merge'?{...(old||{}),...o}:o;
    if(!old){itens.push({c,id,t:'criou',ref:audRef(c,nw),info:c==='logins'?'':audInfo(c,nw),campos:[]});return}
    const ks=op==='merge'?Object.keys(o):[...new Set([...Object.keys(old),...Object.keys(o)])];
    const nz=v=>v==null||v===''||v===false||(Array.isArray(v)&&!v.length)?'':JSON.stringify(v);
    const fv=(k,v)=>/Por$/.test(k)&&v?usrNome(v):/Em$/.test(k)&&typeof v==='number'?fDH(v):audVal(v);
    const campos=ks.filter(k=>!AUD_IGN.has(k)&&nz(old[k])!==nz(nw[k])).map(k=>c==='logins'?[k,'(oculto)','(oculto)']:[AUD_NOME[k]||k,fv(k,old[k]),fv(k,nw[k])]);
    if(campos.length)itens.push({c,id,t:'alterou',ref:audRef(c,nw),campos});
  });
  if(!itens.length)return [];
  const g={};itens.forEach(i=>{const k=i.t+' '+i.c;g[k]=(g[k]||0)+1});
  const cap=x=>x[0].toUpperCase()+x.slice(1);
  const auto=itens.length===1?`${cap(itens[0].t)} ${AUD_COL[itens[0].c]||itens[0].c}`:Object.entries(g).map(([k,n],i)=>{const [t,c]=k.split(' ');return `${i?t:cap(t)} ${n} × ${AUD_COL[c]||c}`}).join(' · ');
  const base={em:now(),por:App.user.id,porNome:App.user.nome||'',acao:meta.acao||auto,motivo:meta.motivo||''};
  const out=[];for(let i=0;i<itens.length;i+=300){const it=itens.slice(i,i+300);out.push({...base,id:'a'+uid(),itens:it,n:itens.length,docIds:[...new Set(it.map(x=>x.id))],refs:[...new Set(it.map(x=>x.ref))].slice(0,300)})}
  return out;
}

function valorFrete(origem,destino,armador,tipo){
  const o=up(origem),d=up(destino);const ls=FRETES().filter(f=>(up(f.origem)===o&&up(f.destino)===d)||(up(f.origem)===d&&up(f.destino)===o));
  const f=ls.find(x=>up(x.armador)===up(armador))||ls.find(x=>!x.armador);
  if(!f)return null;
  return r2(is20(tipo)?num(f.valor)/2:num(f.valor));
}
function ordStats(o){
  const ts=TR().filter(t=>t.ordemId===o.id&&t.status!=='cancelado');
  const real=ts.filter(t=>t.status==='realizado').length,ag=ts.filter(t=>t.status==='agendado').length;
  const sol=num(o.qtd);return{ts,real,ag,sol,saldo:sol?sol-real-ag:null,pct:sol?Math.min(100,Math.round(real*100/sol)):0};
}
const ordensAbertas = ()=>L('ordens').filter(o=>o.status==='aberta').sort((a,b)=>String(b.abertaEm||'').localeCompare(String(a.abertaEm||'')));
const motAtivos = ()=>L('motoristas').filter(m=>m.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome));
const motLabel = m=>`${m.nome}${m.cpf?' · '+fCpf(m.cpf):''}`;
function motPorTexto(v){
  v=String(v||'').trim();if(!v)return null;const ms=motAtivos(),q=semAc(v).replace(/\s+/g,' ');
  const r=ms.find(m=>motLabel(m)===v)||(soDig(v).length===11?ms.find(m=>m.cpf===soDig(v)):null);if(r)return r;
  const ex=ms.filter(m=>semAc(m.nome)===q);if(ex.length===1)return ex[0];
  const ap=ms.filter(m=>(m.apelidos||[]).some(a=>semAc(a)===q));if(ap.length===1)return ap[0];
  const ct=ms.filter(m=>semAc(m.nome).includes(q));return ct.length===1?ct[0]:null;
}
// Duplicidade: mesmo contêiner na mesma OTT (sistema ou planilha) bloqueia; mesmo contêiner nos últimos 7 dias avisa
function checaCntr(cntr,ordemId,data,exceto){
  const r={erro:'',aviso:''};if(!cntr)return r;
  const ts=TR().filter(t=>t.cntr===cntr&&t.status!=='cancelado'&&t.id!==exceto);
  const mo=ts.find(t=>t.ordemId===ordemId);
  if(mo&&ordemId){r.erro=`Já lançado nesta OTT (${fISO(mo.data)} · ${mo.motoristaNome||''})`;return r}
  const o=ordem(ordemId);
  if(o&&DB.hist){const h=DB.hist.find(x=>x.cntr===cntr&&x.ott&&up(x.ott)===up(o.numero));if(h){r.erro=`Já consta na planilha antiga nesta OTT (${h.motorista||''})`;return r}}
  const rec=ts.find(t=>Math.abs(difDias(t.data,data||hojeISO()))<=7);
  if(rec)r.aviso=`Transportado em ${fISO(rec.data)} na OTT ${ordNum(rec.ordemId)}`;
  if(!cntrOk(cntr))r.aviso=(r.aviso?r.aviso+' · ':'')+(/^[A-Z]{4}\d{7}$/.test(cntr)?'Dígito verificador não confere':'Formato inválido (4 letras + 7 números)');
  return r;
}

const horaDe = t=>t.hora||(t.criadoEm?new Date(t.criadoEm).toTimeString().slice(0,5):'');
function kmDe(origem,destino){const o=up(origem),d=up(destino);const ls=FRETES().filter(f=>((up(f.origem)===o&&up(f.destino)===d)||(up(f.origem)===d&&up(f.destino)===o))&&num(f.km)>0);const f=ls.find(x=>!x.armador)||ls[0];return f?num(f.km):null}
// km de um contêiner: 40' = viagem inteira; 20' = meia viagem (a carreta leva dois)
const kmCntr = t=>{const k=kmDe(t.origem,t.destino);return k==null?0:(is20(t.tipo)?k/2:k)};
const viagensDe = ts=>ts.filter(t=>!is20(t.tipo)).length+Math.ceil(ts.filter(t=>is20(t.tipo)).length/2);
function agrupa(ts,chave,nome){const g={};ts.forEach(t=>{const k=chave(t);if(!k)return;(g[k]=g[k]||{nome:nome(t,k),ts:[]}).ts.push(t)});return Object.values(g).map(x=>({nome:x.nome,cntr:x.ts.length,viagens:viagensDe(x.ts),km:x.ts.reduce((s,t)=>s+kmCntr(t),0)})).sort((a,b)=>b.viagens-a.viagens||b.cntr-a.cntr)}
function prodTab(titulo,linhas,col1,extra){

}
function prodDe(ts,nome,extra){const dias=new Set(ts.map(t=>t.data));return{nome,cntr:ts.length,viagens:viagensDe(ts),km:ts.reduce((s,t)=>s+kmCntr(t),0),dias:dias.size,ult:ts.reduce((m,t)=>t.data>m?t.data:m,''),extra}}
function ranking(titulo,lista,vazioTxt,temKm){
  return `<div class="card"><h3>${titulo}</h3>${lista.length?`<div class="tw"><table><thead><tr><th>#</th><th>Nome</th><th class="n">Viagens</th><th class="n">Contêineres</th>${temKm?'<th class="n">Km</th>':''}</tr></thead><tbody>${lista.slice(0,10).map((x,i)=>`<tr${i===0?' class="top1"':''}><td class="mut">${i+1}</td><td><b>${esc(x.nome)}</b></td><td class="n"><b>${fN(x.viagens)}</b></td><td class="n">${fN(x.cntr)}</td>${temKm?`<td class="n">${x.km?fN(x.km):'—'}</td>`:''}</tr>`).join('')}</tbody></table></div>`:vazio(vazioTxt)}</div>`;
}
function grafDia(ts,de,ate){
  const dias=[];for(let d=de;d<=ate&&dias.length<120;d=addDias(d,1))dias.push(d);
  const por={};dias.forEach(d=>por[d]={frota:0,terceiro:0,car:new Set()});ts.forEach(t=>{if(por[t.data]){por[t.data][t.vinculo==='frota'?'frota':'terceiro']++;por[t.data].car.add(t.cavalo||('mot:'+(t.motoristaId||t.motoristaNome)))}});
  const mx=Math.max(1,...dias.map(d=>por[d].frota+por[d].terceiro));
  const step=mx<=5?1:mx<=10?2:mx<=25?5:mx<=50?10:mx<=100?20:Math.ceil(mx/5/50)*50;const top=Math.ceil(mx/step)*step;
  const W=Math.max(1000,dias.length*26),H=240,HB=16,L=34,R=8,T=18,B=28,pw=W-L-R,ph=H-T-B,bw=pw/dias.length,bar=Math.max(4,Math.min(28,bw*0.66));
  const y=v=>T+ph-v*ph/top;
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E5E7EB" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`;
  const cada=Math.ceil(dias.length/16);
  let bs='';dias.forEach((d,i)=>{const p=por[d],x=L+i*bw+(bw-bar)/2,tot=p.frota+p.terceiro;
    const hf=p.frota*ph/top,ht=p.terceiro*ph/top,gap=p.frota&&p.terceiro?2:0;
    if(p.frota)bs+=`<rect x="${x}" y="${y(p.frota)}" width="${bar}" height="${hf}" rx="${p.terceiro?0:3}" fill="${CORES.frota}"/>`;
    if(p.terceiro)bs+=`<rect x="${x}" y="${y(tot)}" width="${bar}" height="${Math.max(0,ht-gap)}" rx="3" fill="${CORES.terceiro}"/>`;
    if(tot&&dias.length<=31)bs+=`<text x="${x+bar/2}" y="${y(tot)-5}" text-anchor="middle" class="vl">${tot}</text>`;
    if(tot&&dias.length<=31)bs+=`<text x="${L+i*bw+bw/2}" y="${H+8}" text-anchor="middle" class="ax">${p.car.size} 🚛</text>`;
    if(i%cada===0)bs+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle" class="ax">${d.slice(8,10)}/${d.slice(5,7)}</text>`;
    bs+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${ph}" fill="transparent" data-tip="${fISO(d)} · ${tot} contêiner(es)|Carros que rodaram: ${p.car.size}|Frota própria: ${p.frota}|Terceiros: ${p.terceiro}"/>`});
  return `<div class="leg"><span><i style="background:${CORES.frota}"></i>Frota própria</span><span><i style="background:${CORES.terceiro}"></i>Terceiros</span><span class="mut">🚛 = carros que rodaram no dia</span></div>
  <div class="gw"><svg viewBox="0 0 ${W} ${H+HB}" style="width:100%;height:auto;min-width:${Math.round(W*0.62)}px" role="img" aria-label="Contêineres transferidos por dia">${g}<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#9CA3AF"/>${bs}</svg></div>`;
}

const RX_CNTR=/^[A-Z]{4}\d{7}$/,RX_PLACA=/^[A-Z]{3}\d[A-Z0-9]\d{2}$/,RX_BKG=/^[A-Z]{1,4}\d{6,10}$/;
// Cada linha: acha contêiner, placas (1ª = cavalo, 2ª = carreta), CPF e CNH (números de 9 a 11 dígitos), booking e o nome (texto logo antes da 1ª placa)
function impLinha(txt){
  const cs=(txt.includes('\t')?txt.split('\t'):txt.split(/;|\s{2,}/)).map(x=>String(x||'').trim());
  const r={txt,cntr:'',lacre:'',bkg:'',nome:'',cav:'',car:'',cpf:'',cnh:'',extra:[]};let iPl=-1,iC=-1;const usados=new Set();
  cs.forEach((c,i)=>{const n=normCntr(c);if(!r.cntr&&RX_CNTR.test(n)){r.cntr=n;iC=i;usados.add(i)}});
  // lacre: a coluna logo depois do contêiner (se tiver número e não for placa, CPF ou OTT)
  {const c=cs[iC+1],n=normCntr(c);if(iC>=0&&n&&n.length<=15&&/\d/.test(n)&&!RX_PLACA.test(n)&&!RX_BKG.test(n)&&soDig(n).length<9){r.lacre=n;usados.add(iC+1)}}
  cs.forEach((c,i)=>{if(usados.has(i))return;const n=normPlaca(c);if(RX_PLACA.test(n)&&!(/^\d+$/.test(n))){if(!r.cav){r.cav=n;iPl=i;usados.add(i)}else if(!r.car){r.car=n;usados.add(i)}}});
  cs.forEach((c,i)=>{if(usados.has(i))return;const d=soDig(c);if(d.length>=9&&d.length<=11&&/^[\d.\-\s]+$/.test(c)){if(!r.cpf){r.cpf=d.padStart(11,'0');usados.add(i)}else if(!r.cnh){r.cnh=d.padStart(11,'0');usados.add(i)}}});
  cs.forEach((c,i)=>{if(usados.has(i))return;const n=normCntr(c);if(!r.bkg&&RX_BKG.test(n)){r.bkg=n;usados.add(i)}else if(r.bkg&&n===r.bkg)usados.add(i)});
  for(let i=iPl-1;i>=0;i--){if(!usados.has(i)&&/[A-Za-zÀ-ú]{3}/.test(cs[i])&&!/\d/.test(cs[i])){r.nome=up(cs[i]).replace(/\s+/g,' ');usados.add(i);break}}
  r.extra=cs.filter((c,i)=>!usados.has(i)&&c&&/[A-Za-z]/.test(c)&&!RX_BKG.test(normCntr(c)));
  return r;
}
function impAnalisa(){
  const f=App.form,o=ordem(f.ordemId);const linhas=String(f.txt||'').split(/\r?\n/).filter(x=>x.trim());
  const ms=L('motoristas'),vistos=new Set(),novos={};const out=[];
  for(const txt of linhas){
    const r=impLinha(txt);if(!r.cntr)continue;
    r.erros=[];r.avisos=[];
    if(vistos.has(r.cntr))r.erros.push('Repetido na lista colada');vistos.add(r.cntr);
    const ck=checaCntr(r.cntr,o.id,f.data,null);if(ck.erro)r.erros.push(ck.erro);if(ck.aviso)r.avisos.push(ck.aviso);
    if(r.bkg&&r.bkg!==normCntr(o.numero)&&r.bkg!==normCntr(o.bookingPorto))r.avisos.push(`Referência ${r.bkg} na linha é diferente da OTT ${o.numero}`);
    if(r.cnh&&r.cnh===r.cpf){r.avisos.push('CNH igual ao CPF na planilha — CNH ignorada');r.cnh=''}
    // motorista: 1º pelo CPF; sem CPF no cadastro, pelo nome (e completa o CPF); senão, cadastro novo
    let m=r.cpf?(ms.find(x=>x.cpf===r.cpf&&!x.mescladoCom)||ms.find(x=>x.cpf===r.cpf)):null;if(m&&m.mescladoCom&&G('motoristas',m.mescladoCom))m=G('motoristas',m.mescladoCom);
    if(!m&&r.cpf&&!cpfValido(r.cpf))r.erros.push(`CPF ${r.cpf} inválido`);
    if(!m&&r.nome&&!r.erros.length){const pn=ms.filter(x=>x.ativo!==false&&!x.cpf&&(semAc(x.nome)===semAc(r.nome)||(x.apelidos||[]).some(a=>semAc(a)===semAc(r.nome))));if(pn.length===1){m=pn[0];r.completa=true}}
    if(m){r.motId=m.id;r.motNome=m.nome;r.motNovo=false;if(m.ativo===false)r.avisos.push('Motorista inativo no cadastro')}
    else if(!r.erros.length){
      if(!r.nome)r.erros.push('Nome do motorista não encontrado na linha');
      else if(!r.cpf)r.erros.push('Linha sem CPF — cadastre o motorista antes');
      else if(!tem('motoristas'))r.erros.push('Motorista não cadastrado — peça o cadastro à supervisão');
      else{const k=r.cpf;novos[k]=novos[k]||{id:'m'+uid(),nome:r.nome};r.motId=novos[k].id;r.motNome=novos[k].nome;r.motNovo=true;
        const hom=ms.find(x=>x.cpf&&semAc(x.nome)===semAc(r.nome));if(hom)r.avisos.push(`Já existe ${hom.nome} com outro CPF (${fCpf(hom.cpf)})`)}
    }
    out.push(r);
  }
  f.prev=out;f.analisadoTxt=f.txt+'|'+f.data+'|'+f.tipo;
}

  if(DB.aud.erro)b+=`<div class="alert">Não foi possível ler a auditoria (${esc(DB.aud.erro)}). Confira se as regras novas do Firestore foram publicadas.</div>`;
  b+=`<div class="mut small" style="margin-bottom:8px">${ds.length} registro(s) · os registros não podem ser alterados nem apagados por ninguém</div>`;

  return b;
};
function audResumo(a){
  const it=a.itens.slice(0,3).map(i=>`<div><span class="mut">${esc(AUD_COL[i.c]||i.c)}</span> <b>${esc(i.ref)}</b>${i.campos?.length?': '+i.campos.slice(0,3).map(([c,de,pa])=>`${esc(c)} <span class="neg">${esc(de||'∅')}</span> → <b>${esc(pa||'∅')}</b>`).join(' · ')+(i.campos.length>3?' …':''):i.info?` <span class="mut">${esc(i.info)}</span>`:''}</div>`).join('');
  return it+(a.itens.length>3?`<div class="mut">+ ${a.n-3} item(ns)</div>`:'');
}
function audTabela(ds){
  return ds.length?`<div class="tw" style="max-height:520px;overflow:auto"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Registro</th><th>Campo</th><th>De</th><th>Para</th><th>Motivo</th></tr></thead><tbody>${ds.flatMap(a=>a.itens.flatMap(i=>(i.campos?.length?i.campos:[[i.t==='criou'?'(criado)':i.t==='excluiu'?'(excluído)':'',i.info||'','']]).map(([c,de,pa])=>`<tr><td class="nw small">${fDH(a.em)}</td><td class="small">${esc(a.porNome||usrNome(a.por))}</td><td class="small">${esc(a.acao)}</td><td class="small"><span class="mut">${esc(AUD_COL[i.c]||i.c)}</span><br><b>${esc(i.ref)}</b></td><td class="small">${esc(c)}</td><td class="small neg">${esc(de)}</td><td class="small"><b>${esc(pa)}</b></td><td class="small">${esc(a.motivo||'')}</td></tr>`))).join('')}</tbody></table></div>`:vazio('Nenhuma alteração registrada');
}

ACT.audVer=d=>{const a=DB.aud?.docs.find(x=>x.id===d.id);if(!a)return;openModal(shell(esc(a.acao),`<div class="kv" style="margin-bottom:10px">${kv('Quando',fDH(a.em))}${kv('Quem',esc(a.porNome||usrNome(a.por)))}${kv('Motivo',esc(a.motivo||'—'))}${kv('Itens',a.n)}</div>${audTabela([a])}`,'<button class="btn" data-act="close">Fechar</button>'),true)};

// histórico de um registro (OTT, transporte, motorista)
ACT.audDoc=async d=>{
  if(!tem('auditoria'))return toast('Sem acesso à auditoria','err');
  let ds=[];
  if(MODO_DEMO)ds=L('auditoria').filter(a=>(a.docIds||[]).includes(d.id));
  else{const s=await FB.db.collection('auditoria').where('docIds','array-contains',d.id).get();s.forEach(x=>ds.push({...x.data(),id:x.id}))}
  ds=ds.sort((a,b)=>b.em-a.em).map(a=>({...a,itens:a.itens.filter(i=>i.id===d.id)}));
  const vt=App.formRender?{f:App.form,r:App.formRender}:null;
  openModal(shell('Histórico · '+esc(d.ref||''),audTabela(ds),'<button class="btn" data-act="close">Fechar</button>'),true);
};

  ${c?`<div class="alert i">Última carga: ${fDH(c.em)} por ${esc(usrNome(c.por))} · ${fN(c.motoristas)} motoristas novos · ${fN(c.historico)} linhas de histórico</div>`:''}

  <datalist id="dlLoc">${li.locais.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  <div class="bar" style="margin:10px 0 0"><span class="sp"></span><button class="btn p" data-act="frSave">Salvar tabela de fretes</button></div></div>`;

  <div class="tw"><table><thead><tr><th>Cliente</th><th>Local A</th><th>Local B</th><th class="n">Valor cobrado (R$)</th><th class="n">Custo terceiro</th><th class="n">Diferença</th><th></th></tr></thead><tbody>${pc.map((l,i)=>{const cu=valorFrete(l.origem,l.destino,l.armador,'40HC'),v=num(l.valor);return `<tr><td><select data-pc="${i}.armador">${opts(arms,'Selecione…').map(([v2,t])=>`<option value="${esc(v2)}" ${v2===up(l.armador)?'selected':''}>${esc(t)}</option>`).join('')}</select></td><td><input list="dlLoc" value="${esc(l.origem)}" data-pc="${i}.origem"></td><td><input list="dlLoc" value="${esc(l.destino)}" data-pc="${i}.destino"></td><td><input inputmode="decimal" value="${esc(l.valor)}" data-pc="${i}.valor" style="text-align:right"></td><td class="n mut">${cu==null?'—':fR(cu)}</td><td class="n">${cu==null||!v?'—':`${fR(v-cu)}<div class="small mut">${fN((v-cu)*100/v,1)}%</div>`}</td><td><button class="btn sm danger" data-act="pcDel" data-i="${i}">Remover</button></td></tr>`}).join('')||`<tr><td colspan="7">${vazio('Nenhum preço cadastrado')}</td></tr>`}</tbody></table></div>

  <b>noturno</b> = no horário abaixo, de segunda a sábado, e sábado a partir do horário indicado; <b>domingo e feriado</b> = o dia todo. Estes são os padrões de cada cliente: a OTT já nasce com eles e pode ser ajustada. Se o overtime já estiver embutido no preço, marque "incluso".</p>

  <div class="card"><h3>Geral</h3><div class="fr"><label class="f">Dias de transportes carregados ao abrir o sistema<input id="cfJan" type="number" min="30" max="730" value="${CFG().janela}"></label></div><div class="small mut">Períodos mais antigos são buscados sob demanda na consulta (economiza leituras do Firebase).</div>
  <div class="fr" style="margin-top:12px"><label class="f">Placas dos cavalos da frota própria (Ziran)<input id="cfFrota" value="${esc(PLACAS_FROTA().join(', '))}" style="text-transform:uppercase"></label></div><div class="small mut">Transporte feito com essas placas, ou por motorista marcado como frota própria, não entra no pagamento de terceiros.</div>

  return b;
};

async function emailDoLogin(v){
  v=String(v||'').trim();
  if(v.includes('@'))return v;
  const c=soDig(v);if(c.length!==11)throw new Error('Informe o CPF com 11 números');
  const d=await FB.db.collection('logins').doc(c).get();
  if(!d.exists)throw new Error('CPF não cadastrado');
  return d.data().email;
}
ACT.loginFB=async()=>{
  const v=$('#lgE').value.trim(),s=$('#lgS').value;if(!v||!s)return toast('Informe CPF e senha','err');
  let e;try{e=await emailDoLogin(v)}catch(err){return toast(err.message,'err')}
  try{await firebase.auth().signInWithEmailAndPassword(e,s)}catch(err){toast('CPF/e-mail ou senha inválidos','err')}
};
ACT.esqueci=async()=>{
  const v=($('#lgE')?.value||'').trim();
  if(!v.includes('@'))return toast('Peça à gestão para redefinir sua senha no sistema.','');
  await firebase.auth().sendPasswordResetEmail(v);toast('E-mail de redefinição enviado','ok');
};
ACT.minhaSenha=()=>{
  App.form={atual:'',nova:'',conf:''};
  const b=MODO_DEMO?'<div class="alert i">No modo demonstração não há senha.</div>':`<div class="fr" style="grid-template-columns:1fr">${fld('Senha atual',I('atual','type="password" autocomplete="current-password"'),1)}${fld('Nova senha (mín. 6)',I('nova','type="password" autocomplete="new-password"'),1)}${fld('Repita a nova senha',I('conf','type="password" autocomplete="new-password"'),1)}</div>`;
  openModal(shell('Alterar minha senha',b,MODO_DEMO?'':`<button class="btn" data-act="close">Cancelar</button><button class="btn p" data-act="minhaSenhaSalvar">Salvar nova senha</button>`));
};
ACT.minhaSenhaSalvar=async()=>{
  const f=App.form,u=firebase.auth().currentUser;
  if(String(f.nova).length<6)return toast('Nova senha com no mínimo 6 caracteres','err');
  if(f.nova!==f.conf)return toast('As senhas não conferem','err');
  try{await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,f.atual))}catch(e){return toast('Senha atual incorreta','err')}
  await u.updatePassword(f.nova);closeModal();toast('Senha alterada','ok');
};

ACT.agSalvar=async()=>{
  const f=App.form,o=ordem(f.ordemId);

  if(!f.data)return toast('Informe a data','err');
  const m=motPorTexto(f.motTxt);if(!m)return toast('Selecione um motorista do cadastro','err');

  if(!its.length)return toast('Informe ao menos um contêiner','err');
  const vistos=new Set();const avisos=[];
  for(const it of its){
    if(vistos.has(it.cntr))return toast(it.cntr+' repetido neste lançamento','err');vistos.add(it.cntr);
    const ck=checaCntr(it.cntr,o.id,f.data,null);if(ck.erro)return toast(it.cntr+': '+ck.erro,'err');if(ck.aviso)avisos.push(it.cntr+': '+ck.aviso);

  await S.batch(ops);

// Sugestão: cadastro SEM CPF cujo nome bate com um cadastro COM CPF (nome igual, começo igual ou contido) — placa em comum reforça
function dupMotoristas(){
  const at=L('motoristas').filter(m=>m.ativo!==false&&!m.mescladoCom);
  const comCpf=at.filter(m=>m.cpf);const pl=m=>new Set([...(m.cavalos||[]),...(m.carretas||[])]);
  const tk=x=>semAc(x).replace(/[^A-Z ]/g,' ').split(/\s+/).filter(w=>w.length>1&&!['DE','DA','DO','DOS','DAS'].includes(w));
  const out=[];
  at.filter(m=>!m.cpf).forEach(a=>{
    const ta=tk(a.nome),pa=pl(a);if(!ta.length)return;
    const cs=comCpf.map(b=>{const tb=tk(b.nome),ap=(b.apelidos||[]).map(semAc);let sc=0,mot='';
      if(ta.join(' ')===tb.join(' ')||ap.includes(semAc(a.nome))){sc=3;mot='mesmo nome'}
      else if(ta.every((w,i)=>tb[i]===w)){sc=2;mot='nome completo começa igual'}
      else if(ta.length>=2&&ta.every(w=>tb.includes(w))){sc=1;mot='nome contido'}
      if(!sc)return null;
      const com=[...pa].filter(x=>pl(b).has(x));if(com.length){sc+=2;mot+=' · placa em comum '+com.join(', ')}
      let duv=false;if(!com.length&&pa.size&&pl(b).size&&sc<3){duv=true;mot+=' · placas diferentes'}
      return {b,sc,mot,duv}}).filter(Boolean).sort((x,y)=>y.sc-x.sc);
    if(!cs.length)return;
    const top=cs.filter(c=>c.sc===cs[0].sc);
    out.push({a,cands:cs,amb:top.length>1||top[0].duv});
  });
  return out.sort((x,y)=>x.a.nome.localeCompare(y.a.nome));
}
function opsJuntar(deId,paraId){
  const a=G('motoristas',deId),b0=G('motoristas',paraId);if(!a||!b0||a.id===b0.id)return [];
  const b=JSON.parse(JSON.stringify(b0)),un=(x,y)=>[...new Set([...(x||[]),...(y||[])])];
  b.cavalos=un(b.cavalos,a.cavalos);b.carretas=un(b.carretas,a.carretas);
  b.apelidos=un(b.apelidos,[up(a.nome),...(a.apelidos||[])]).filter(x=>semAc(x)!==semAc(b.nome));
  ['cnh','cnhValidade','telefone','pix','empresa'].forEach(k=>{if(!b[k]&&a[k])b[k]=a[k]});
  if(!b.cpf&&a.cpf)b.cpf=a.cpf;
  if(a.vinculo==='frota')b.vinculo='frota';
  b.juntados=[...(b.juntados||[]),{id:a.id,nome:a.nome,em:now(),por:App.user.id}];
  const ops=[['set','motoristas',b],['merge','motoristas',{id:a.id,ativo:false,pend:[],mescladoCom:b.id,mescladoEm:now(),mescladoPor:App.user.id}]];
  TR().filter(t=>t.motoristaId===a.id).forEach(t=>ops.push(['merge','transportes',{id:t.id,motoristaId:b.id,motoristaNome:b.nome,motoristaCpf:b.cpf||'',vinculo:vincDe(b,t.cavalo)}]));
  return ops;
}

  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');

/* ---- configurações ---- */
function lerFretesTela(){const ls=JSON.parse(JSON.stringify(FRETES()));document.querySelectorAll('[data-fr]').forEach(el=>{const [i,k]=el.dataset.fr.split('.');ls[i][k]=el.value});return ls}
ACT.frAdd=async()=>{const ls=document.querySelector('[data-fr]')?lerFretesTela():FRETES();ls.push({origem:'ZIRAN',destino:'',armador:'',valor:'',km:''});await S.put('config',{id:'fretes',linhas:ls})};
ACT.frDel=async d=>{const ls=lerFretesTela();ls.splice(+d.i,1);await S.put('config',{id:'fretes',linhas:ls})};
ACT.frSave=async()=>{
  const ls=lerFretesTela().map(l=>({origem:up(l.origem),destino:up(l.destino),armador:l.armador||'',valor:r2(num(l.valor)),km:String(l.km??'').trim()===''?null:r2(num(l.km))})).filter(l=>l.origem&&l.destino);
  const k=new Set();for(const l of ls){const x=[l.origem,l.destino].sort().join('<>')+'>'+l.armador;if(k.has(x))return toast(`Rota repetida: ${l.origem} ↔ ${l.destino} ${l.armador||''}`,'err');k.add(x)}
  await S.put('config',{id:'fretes',linhas:ls});
  // Atualiza o valor dos transportes ainda sem lote
  const ops=TR().filter(t=>t.status!=='cancelado'&&!t.pagamentoId).map(t=>{const v=valorFrete(t.origem,t.destino,t.armador,t.tipo);return v!==t.valorFrete?['merge','transportes',{id:t.id,valorFrete:v}]:null}).filter(Boolean);
  if(ops.length&&confirm(`Atualizar o valor de ${ops.length} transporte(s) que ainda não estão em lote de pagamento?`))await S.batch(ops);
  toast('Tabela de fretes salva','ok');
};
function lerPrecosTela(){const ls=JSON.parse(JSON.stringify(PRECOS()));document.querySelectorAll('[data-pc]').forEach(el=>{const [i,k]=el.dataset.pc.split('.');ls[i][k]=el.value});return ls}
ACT.pcAdd=async()=>{const ls=document.querySelector('[data-pc]')?lerPrecosTela():PRECOS();ls.push({armador:'',origem:'ZIRAN',destino:'',valor:''});await S.put('config',{id:'precos',linhas:ls},{acao:'Adicionou linha na tabela de preços'})};
ACT.pcDel=async d=>{const ls=lerPrecosTela();const x=ls.splice(+d.i,1)[0];await S.put('config',{id:'precos',linhas:ls},{acao:`Removeu preço ${x?.armador||''} ${x?.origem||''}↔${x?.destino||''}`})};
ACT.pcSave=async()=>{
  const ls=lerPrecosTela().map(l=>({armador:up(l.armador),origem:up(l.origem),destino:up(l.destino),valor:r2(num(l.valor))})).filter(l=>l.armador&&l.origem&&l.destino);
  const k=new Set();for(const l of ls){const x=l.armador+'>'+[l.origem,l.destino].sort().join('<>');if(k.has(x))return toast(`Preço repetido: ${l.armador} ${l.origem} ↔ ${l.destino}`,'err');k.add(x)}
  await S.put('config',{id:'precos',linhas:ls},{acao:'Alterou tabela de preços ao cliente'});toast('Preços salvos','ok');
};
ACT.clSave=async()=>{
  const m={};document.querySelectorAll('[data-cl]').forEach(el=>{const i=el.dataset.cl.lastIndexOf('.'),a=el.dataset.cl.slice(0,i),k=el.dataset.cl.slice(i+1);(m[a]=m[a]||{});m[a][k]=el.type==='checkbox'?el.checked:el.type==='time'?el.value:r2(num(el.value))});
  await S.put('config',{id:'clientes',lista:m},{acao:'Alterou condições de overtime/triagem por cliente'});toast('Condições salvas','ok');
};
ACT.ferSave=async()=>{
  const out=[],err=[];$('#cfFer').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>{const m=l.match(/^(\d{2})\/(\d{2})\/(\d{4})\s*(.*)$/);if(!m)return err.push(l);out.push(`${m[3]}-${m[2]}-${m[1]} ${m[4]}`.trim())});
  if(err.length)return toast('Linha fora do padrão dd/mm/aaaa: '+err[0],'err');
  out.sort();await S.put('config',{id:'feriados',linhas:out},{acao:'Alterou lista de feriados'});toast(`${out.length} feriado(s) salvos`,'ok');
};
ACT.cfgSave=async()=>{
  const ln=id=>[...new Set($(id).value.split('\n').map(up).filter(Boolean))];
  await S.batch([['set','config',{id:'listas',armadores:ln('#cfArm'),locais:ln('#cfLoc')}],['set','config',{...CFG(),id:'geral',janela:Math.min(730,Math.max(30,parseInt($('#cfJan').value,10)||120)),placasFrota:[...new Set($('#cfFrota').value.split(/[,;\s]+/).map(normPlaca).filter(Boolean))]}]]);toast('Configurações salvas','ok');
};
async function lerCarga(el){
  const file=el.files&&el.files[0];el.value='';if(!file)return;
  let j;try{j=JSON.parse(await file.text())}catch(e){return toast('Arquivo inválido','err')}
  if(!j||j.sistema!=='ziran-transportes'||j.tipo!=='carga-inicial')return toast('Esse arquivo não é a carga inicial do sistema de Transportes','err');
  const exist=L('motoristas'),cpfs=new Set(exist.map(m=>m.cpf).filter(Boolean)),ids=new Set(exist.map(m=>m.id));
  const novos=j.motoristas.filter(m=>!ids.has(m.id)&&!(m.cpf&&cpfs.has(m.cpf)));
  const temHist=L('historico').length>0||(!MODO_DEMO&&(await FB.db.collection('historico').limit(1).get()).size>0);
  if(!confirm(`Carga inicial:\n\n• ${novos.length} motorista(s) novo(s) (de ${j.motoristas.length} no arquivo)\n• ${temHist?'Histórico já carregado — não será gravado de novo':j.historico.length+' linhas de histórico da planilha'}\n\nContinuar?`))return;
  const ops=novos.map(m=>['set','motoristas',{id:m.id,nome:m.nome,cpf:m.cpf||'',cnh:m.cnh||'',cnhValidade:'',telefone:'',vinculo:m.vinculo||'terceiro',empresa:'',pix:'',cavalos:m.cavalos||[],carretas:m.carretas||[],apelidos:m.apelidos||[],pend:m.pend||[],ativo:true,criadoEm:now(),criadoPor:App.user.id,origem:'planilha'}]);
  if(!temHist){const H=j.historico.map(h=>h.map(x=>String(x??'').replace(/\|/g,'/')).join('|'));for(let i=0,n=0;i<H.length;i+=900,n++)ops.push(['set','historico',{id:'h'+String(n).padStart(3,'0'),linhas:H.slice(i,i+900)}])}
  const li=LISTAS();ops.push(['set','config',{id:'listas',armadores:[...new Set([...li.armadores,...(j.armadores||[])])],locais:[...new Set([...li.locais,...(j.locais||[])])]}]);
  ops.push(['set','config',{id:'carga',em:now(),por:App.user.id,motoristas:novos.length,historico:temHist?0:j.historico.length}]);
  toast('Gravando… aguarde','');
  await S.batch(ops);DB.hist=null;toast(`Carga concluída: ${novos.length} motoristas${temHist?'':' e histórico'}`,'ok');
}
const COLS_BACKUP=['config','motoristas','ordens','transportes','pagamentos','usuarios'];
ACT.backup=async()=>{
  const dados={};COLS_BACKUP.forEach(c=>dados[c]=c==='transportes'?Object.fromEntries(TR().map(t=>[t.id,t])):DB.data[c]);
  const blob=new Blob([JSON.stringify({sistema:'ziran-transportes',versao:1,projeto:FIREBASE_CONFIG.projectId||'demo',exportadoEm:now(),dados},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ziran-transportes-backup-${hojeISO()}.json`;a.click();
};
ACT.resetDemo=()=>{if(!confirm('Apagar todos os dados de demonstração?'))return;localStorage.removeItem(LS_KEY);sessionStorage.removeItem('ziran_transp_user');location.reload()};

/* =========================================================
   INÍCIO
   ========================================================= */
function boot(){
  if(MODO_DEMO){
    Local.init();
    const id=sessionStorage.getItem('ziran_transp_user'),u=id&&G('usuarios',id);
    if(u&&u.ativo)entrar(u);else renderLogin();
    return;
  }
  FB.init();App.authState='loading';renderLogin();
  firebase.auth().onAuthStateChanged(u=>{
    FB.stop();App.user=null;App.booting=false;App.authUid=u?u.uid:null;App.authEmail=u?u.email:'';
    if(!u){App.authState='out';renderLogin();return}
    App.authState='loading';renderLogin();FB.listenMe(u.uid);FB.listen(['config']);
  });
}
boot();
</script>
